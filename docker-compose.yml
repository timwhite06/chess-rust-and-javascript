services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chess-rust-javascript
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

